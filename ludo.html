<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ميدان معركة اللودو الاحترافية المتقدمة | تطوير حمزة الحماده</title>
    <style>
        :root {
            --bg-color: #06060c;
            --panel-bg: rgba(18, 18, 32, 0.95);
            --secondary-neon: #00f0ff;
            --ludo-red: #ff2a5f;
            --ludo-green: #10b981;
            --ludo-yellow: #ffd700;
            --ludo-blue: #00f0ff;
        }

        /* منع التحديد والنسخ نهائياً */
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { overflow-x: hidden; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a0f3c 0%, #030307 100%);
            color: #fff;
            text-align: center;
            margin: 0; padding: 10px;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متحركة فاخرة */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
            will-change: transform;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 42, 95, 0.35), transparent 70%);
            top: -120px; left: -120px;
            animation: floatOrb1 22s ease-in-out infinite;
        }
        body::after {
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.28), transparent 70%);
            bottom: -150px; right: -150px;
            animation: floatOrb2 28s ease-in-out infinite;
        }
        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(180px, 120px) scale(1.15); }
        }
        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(-180px, -120px) scale(1.1); }
        }

        .ludo-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(0, 240, 255, 0.2);
            max-width: 500px; width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            position: relative;
            animation: containerIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes containerIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
            gap: 6px; flex-wrap: wrap;
        }

        h1 {
            font-size: 22px; margin: 0; font-weight: 900;
            background: linear-gradient(90deg, var(--ludo-red), var(--ludo-yellow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .invite-btn {
            background: linear-gradient(90deg, #10b981, #059669); color: white;
            border: none; padding: 8px 14px; font-size: 12px; font-weight: bold;
            border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            display: flex; align-items: center; gap: 5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .invite-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(16, 185, 129, 0.6); }

        .spectator-btn {
            background: rgba(255,255,255,0.1); color: #00f0ff;
            border: 1px solid #00f0ff; padding: 6px 12px; font-size: 12px; font-weight: bold;
            border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .spectator-btn:hover { background: rgba(0, 240, 255, 0.15); transform: translateY(-2px); }

        .icon-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; width: 34px; height: 34px;
            border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.2s ease;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.08); }
        .icon-btn.muted { opacity: 0.5; }

        /* شبكة اللعبة */
        #ludo-grid {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%; max-width: 420px; aspect-ratio: 1;
            background: #0f1015; gap: 2px;
            border: 6px solid #1a1a2e; border-radius: 18px;
            margin: 15px auto; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 30px rgba(0, 240, 255, 0.05);
            position: relative;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* خاصية قلب الشاشة الذكية للخصم الأصفر */
        .perspective-yellow {
            transform: rotate(180deg);
        }
        .perspective-yellow .player-dice-zone,
        .perspective-yellow .choice-box,
        .perspective-yellow .ludo-safe,
        .perspective-yellow .ludo-token::after {
            transform: rotate(180deg);
        }

        .ludo-cell {
            background: #1f2136; width: 100%; height: 100%;
            position: relative; display: flex; justify-content: center; align-items: center;
            border-radius: 2px;
            transition: background 0.3s ease;
        }
        
        .ludo-red-bg { background-color: var(--ludo-red) !important; }
        .ludo-green-bg { background-color: var(--ludo-green) !important; }
        .ludo-yellow-bg { background-color: var(--ludo-yellow) !important; }
        .ludo-blue-bg { background-color: var(--ludo-blue) !important; }
        .ludo-safe { font-size: 13px; filter: drop-shadow(0 0 3px #000); position: absolute; z-index: 2; animation: starTwinkle 3s ease-in-out infinite; }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        
        #center-finish-zone {
            position: relative;
            z-index: 20;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 215, 0, 0.3);
            animation: centerGlow 2s ease-in-out infinite alternate;
        }
        @keyframes centerGlow {
            0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.2); }
            100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 215, 0, 0.4); }
        }

        .ludo-home-area {
            grid-column: span 6; grid-row: span 6;
            display: flex; justify-content: center; align-items: center;
            background: #151728; border: 1px solid #252a4a;
            position: relative;
            overflow: hidden;
        }
        .ludo-home-area::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
        }
        .ludo-home-inner {
            width: 85%; height: 85%; border-radius: 14px;
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 8px; padding: 8px; background: rgba(0,0,0,0.4);
            position: relative; z-index: 1;
        }
        .ludo-token-slot { 
            width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.03); 
            position: relative; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }
        
        /* تصميم الأحجار الفاخرة */
        .ludo-token {
            width: 85%; height: 85%; border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6), inset 0 -4px 6px rgba(0,0,0,0.4), inset 0 4px 6px rgba(255,255,255,0.25);
            border: 2px solid white; cursor: pointer; z-index: 10;
            position: relative; transform: scale(1);
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.15s linear, left 0.15s linear, box-shadow 0.2s ease;
        }
        .ludo-token::after {
            content: "👑";
            font-size: 11px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            position: absolute;
        }
        
        .token-jump {
            animation: tokenJumpAnim 0.2s ease-in-out;
        }
        @keyframes tokenJumpAnim {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.35) translateY(-12px); filter: drop-shadow(0 12px 12px rgba(0,0,0,0.6)); }
            100% { transform: scale(1) translateY(0); }
        }

        .ludo-token.active-turn {
            animation: pulseGlow 1s infinite alternate;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .ludo-token.active-turn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border: 2px solid #fff;
            border-radius: 50%;
            animation: pulseRing 1.2s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 8px #fff, 0 5px 10px rgba(0,0,0,0.6); }
            100% { transform: scale(1.12); box-shadow: 0 0 22px var(--secondary-neon), 0 5px 10px rgba(0,0,0,0.6); }
        }
        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* تكديس الأحجار */
        .ludo-cell .ludo-token { width: 70%; height: 70%; position: absolute; }
        .ludo-cell .ludo-token:nth-child(1) { transform: scale(0.9); z-index: 10; }
        .ludo-cell .ludo-token:nth-child(2) { transform: translate(-4px, -4px) scale(0.85); z-index: 11; }
        .ludo-cell .ludo-token:nth-child(3) { transform: translate(4px, 4px) scale(0.85); z-index: 12; }
        .ludo-cell .ludo-token:nth-child(4) { transform: translate(-4px, 4px) scale(0.75); z-index: 13; }
        
        #center-finish-zone .ludo-token { transform: scale(0.6) !important; margin: 2px; }
        #center-finish-zone .ludo-token:nth-child(1) { transform: translate(-8px, -8px) scale(0.6) !important; }
        #center-finish-zone .ludo-token:nth-child(2) { transform: translate(8px, -8px) scale(0.6) !important; }
        #center-finish-zone .ludo-token:nth-child(3) { transform: translate(-8px, 8px) scale(0.6) !important; }
        #center-finish-zone .ludo-token:nth-child(4) { transform: translate(8px, 8px) scale(0.6) !important; }

        .token-red { background: radial-gradient(circle at 30% 30%, #ff8bb1, #ff2a5f 60%, #a3002e); }
        .token-green { background: radial-gradient(circle at 30% 30%, #62f2bd, #10b981 60%, #046a48); }
        .token-yellow { background: radial-gradient(circle at 30% 30%, #fff38a, #ffd700 60%, #b38b00); }
        .token-blue { background: radial-gradient(circle at 30% 30%, #8ae0ff, #00f0ff 60%, #0080a3); }
        
        /* مناطق الزهر */
        .player-dice-zone {
            position: absolute;
            z-index: 1000;
            background: rgba(15, 16, 21, 0.95);
            padding: 6px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            width: 70px;
            transition: transform 0.2s ease;
        }
        .active-dice-turn {
            border-color: var(--secondary-neon);
            animation: diceGlow 1.5s infinite alternate;
        }
        @keyframes diceGlow {
            0% { box-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
            100% { box-shadow: 0 0 18px rgba(0, 240, 255, 0.7); }
        }
        
        #dice-zone-red { bottom: 8px; left: 8px; }
        #dice-zone-yellow { top: 8px; right: 8px; }
        #dice-zone-green { top: 8px; left: 8px; }
        #dice-zone-blue { bottom: 8px; right: 8px; }

        .dice-label { font-size: 9px; color: #aaa; font-weight: bold; }

        .scene-dice {
            width: 40px; height: 40px; perspective: 200px; cursor: pointer;
        }
        .cube-dice {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg); transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cube-face {
            position: absolute; width: 40px; height: 40px; background: #fff;
            border: 2px solid #ccc; border-radius: 8px; font-size: 20px; font-weight: bold;
            color: #111; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 8px #ddd;
        }
        .face-1  { transform: rotateY(0deg) translateZ(20px); }
        .face-2  { transform: rotateY(90deg) translateZ(20px); }
        .face-3  { transform: rotateX(90deg) translateZ(20px); }
        .face-4  { transform: rotateX(-90deg) translateZ(20px); }
        .face-5  { transform: rotateY(-90deg) translateZ(20px); }
        .face-6  { transform: rotateY(180deg) translateZ(20px); }

        .cube-dice.rolling { animation: spinCube 0.45s linear infinite; }
        @keyframes spinCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(720deg) rotateY(540deg); }
        }

        .pool-badge {
            background: #252a44; border: 1px solid var(--ludo-yellow);
            border-radius: 6px; padding: 2px 4px; font-size: 9px; font-weight: bold;
            color: var(--ludo-yellow); text-align: center; width: 100%;
            transition: background 0.3s ease;
        }

        /* شريط التقدم */
        .progress-panel {
            display: flex; justify-content: space-around; gap: 6px;
            margin: 8px auto; padding: 8px;
            background: rgba(0,0,0,0.4); border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .progress-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            flex: 1; font-size: 10px; color: #aaa;
        }
        .progress-dots { display: flex; gap: 3px; }
        .p-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }
        .p-dot.filled { box-shadow: 0 0 6px currentColor; }
        .p-red { color: var(--ludo-red); }
        .p-red.filled { background: var(--ludo-red); }
        .p-green { color: var(--ludo-green); }
        .p-green.filled { background: var(--ludo-green); }
        .p-yellow { color: var(--ludo-yellow); }
        .p-yellow.filled { background: var(--ludo-yellow); }
        .p-blue { color: var(--ludo-blue); }
        .p-blue.filled { background: var(--ludo-blue); }

        /* نوافذ منبثقة */
        .custom-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 5000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.25s ease;
        }
        .custom-overlay.active { display: flex; }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .custom-box {
            background: #18192a; border: 2px solid var(--secondary-neon);
            padding: 20px; border-radius: 16px; width: 90%; max-width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 30px rgba(0, 240, 255, 0.2);
            text-align: center;
            animation: boxPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes boxPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .custom-box h3 { color: #fff; margin-top: 0; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        
        .choice-btn {
            background: linear-gradient(90deg, #511fff, var(--secondary-neon));
            color: #fff; border: none; padding: 12px; margin: 6px 0; width: 100%;
            font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(81, 31, 255, 0.3);
        }
        .choice-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(81, 31, 255, 0.5); }

        .friend-item, .spectator-item {
            background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            color: #ccc; font-size: 14px; border: 1px solid rgba(255,255,255,0.1);
            transition: background 0.2s ease;
        }
        .friend-item:hover { background: rgba(255,255,255,0.08); }
        .friend-item button {
            background: #10b981; color: #fff; border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        button.exit-btn {
            background: linear-gradient(90deg, var(--ludo-red), #b5002e); color: white;
            border: none; padding: 12px 24px; font-size: 14px; font-weight: bold;
            border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button.exit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 42, 95, 0.55); }
        
        #toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #10b981; color: white; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; opacity: 0; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 99999;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            max-width: 88%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* شاشة الفوز */
        .win-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 7, 0.95); z-index: 99999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .win-overlay.active { display: flex; }
        .win-box {
            background: #18192a; border: 3px solid var(--ludo-yellow);
            padding: 30px 24px; border-radius: 24px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255, 215, 0, 0.4);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 2;
        }
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .trophy-anim {
            font-size: 60px; display: inline-block;
            animation: trophyBounce 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }
        @keyframes trophyBounce {
            0%, 100% { transform: translateY(0) scale(1) rotate(-5deg); }
            50% { transform: translateY(-15px) scale(1.1) rotate(5deg); }
        }
        .win-btn {
            flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; font-size: 14px;
            transition: transform 0.2s ease;
        }
        .win-btn:hover { transform: translateY(-2px); }
        .rematch-btn { background: linear-gradient(90deg, #10b981, #059669); color: white; }
        .exit-game-btn { background: linear-gradient(90deg, var(--ludo-red), #b5002e); color: white; }
        .rematch-status {
            margin: 15px 0; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px; text-align: right; line-height: 1.9;
        }

        /* كونفيتي */
        #confetti-container {
            position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 100000;
        }
        .confetti-piece {
            position: absolute; top: -20px;
            width: 8px; height: 14px; opacity: 0.9;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
        }

        @media (max-width: 380px) {
            .ludo-container { padding: 14px; }
            h1 { font-size: 18px; }
            .player-dice-zone { width: 60px; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="ludo-container">
        <div class="header-actions">
            <button class="invite-btn" onclick="openModal('friends-modal')">📩 الأصدقاء</button>
            <div style="display:flex; gap:6px;">
                <button class="icon-btn" id="sound-toggle" onclick="toggleSound()" title="الصوت">🔊</button>
                <button class="spectator-btn" onclick="openModal('spectators-modal')">
                    👁️ <span id="spectator-count">0</span>
                </button>
            </div>
        </div>

        <div id="ludo-role-text" style="font-size: 13px; color: #b1b1c7; margin-bottom: 5px;">جاري الفحص المزامني...</div>
        <div id="ludo-status-text" style="color: var(--secondary-neon); font-size: 15px; font-weight: bold; margin-bottom: 10px; min-height: 22px;">تحميل قواعد اللعبة...</div>

        <div class="progress-panel" id="progress-panel"></div>
        
        <div id="ludo-grid"></div>
        
        <button onclick="exitGame()" class="exit-btn">انسحاب والعودة للمنصة</button>

    <script>
        // =============== الحماية ===============
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 73)) {
                e.preventDefault(); return false;
            }
        });

        // =============== المحرك الصوتي ===============
        const AudioEngine = {
            ctx: null,
            muted: false,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playStep() {
                if (this.muted) return;
                this.init(); let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playDice() {
                if (this.muted) return;
                this.init(); let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination); osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(350, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            },
            playEat() {
                if (this.muted) return;
                this.init(); let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination); osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            },
            playWin() {
                if (this.muted) return;
                this.init(); let now = this.ctx.currentTime;
                const playNote = (freq, start, dur) => {
                    let o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.connect(g); g.connect(this.ctx.destination); o.frequency.setValueAtTime(freq, now + start);
                    g.gain.setValueAtTime(0.12, now + start); g.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
                    o.start(now + start); o.stop(now + start + dur);
                };
                playNote(523.25, 0, 0.15); playNote(659.25, 0.12, 0.15); playNote(783.99, 0.24, 0.15); playNote(1046.50, 0.36, 0.4);
            }
        };

        function toggleSound() {

            showToast(AudioEngine.muted ? '🔇 تم كتم الصوت' : '🔊 تم تفعيل الصوت');
        }

        // =============== Firebase ===============
        const firebaseConfig = {
            apiKey: "AIzaSyDr0kbQDE90hhEMohV6X1b4ndu4L7uZz24",
            projectId: "mehamzaalanat",
            databaseURL: "https://mehamzaalanat-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "mehamzaalanat.firebasestorage.app",
            appId: "1:10248497310:android:bc2b88983738827f15338f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('gameId');
        let rawRole = urlParams.get('role'); 
        const gameType = urlParams.get('type') || 'ludo2';

        let myRole = 'spectator';
        let isSpectator = true;
        let spectatorName = "مشاهد_" + Math.floor(Math.random() * 9999);

        let isRollingDice = false;
        let isMovingToken = false;   // قفل حركة الأحجار
        let noMoveTimerScheduled = false; // منع تكرار جدولة تمرير الدور

        if (rawRole) {
            let r = rawRole.toLowerCase();
            let validRoles = gameType === 'ludo4' ? ['red', 'yellow', 'green', 'blue'] : ['red', 'yellow'];
            if (validRoles.includes(r)) {
                myRole = r;
                isSpectator = false;
            }
        }

        // خرائط اللودو
        const pathCoords = [
            {r:6, c:1}, {r:6, c:2}, {r:6, c:3}, {r:6, c:4}, {r:6, c:5}, {r:5, c:6}, {r:4, c:6}, {r:3, c:6}, {r:2, c:6}, {r:1, c:6}, {r:0, c:6}, {r:0, c:7}, {r:0, c:8},
            {r:1, c:8}, {r:2, c:8}, {r:3, c:8}, {r:4, c:8}, {r:5, c:8}, {r:6, c:9}, {r:6, c:10}, {r:6, c:11}, {r:6, c:12}, {r:6, c:13}, {r:6, c:14}, {r:7, c:14}, {r:8, c:14},
            {r:8, c:13}, {r:8, c:12}, {r:8, c:11}, {r:8, c:10}, {r:8, c:9}, {r:9, c:8}, {r:10, c:8}, {r:11, c:8}, {r:12, c:8}, {r:13, c:8}, {r:14, c:8}, {r:14, c:7}, {r:14, c:6},
            {r:13, c:6}, {r:12, c:6}, {r:11, c:6}, {r:10, c:6}, {r:9, c:6}, {r:8, c:5}, {r:8, c:4}, {r:8, c:3}, {r:8, c:2}, {r:8, c:1}, {r:8, c:0}, {r:7, c:0}, {r:6, c:0}
        ];

        const homePaths = {
            green: [{r:7, c:1}, {r:7, c:2}, {r:7, c:3}, {r:7, c:4}, {r:7, c:5}],
            yellow: [{r:1, c:7}, {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:7}],
            blue: [{r:7, c:13}, {r:7, c:12}, {r:7, c:11}, {r:7, c:10}, {r:7, c:9}],
            red: [{r:13, c:7}, {r:12, c:7}, {r:11, c:7}, {r:10, c:7}, {r:9, c:7}]
        };

        const startOffsets = { green: 0, yellow: 13, blue: 26, red: 39 };
        const safeZones = [0, 8, 13, 21, 26, 34, 39, 47]; 

        let gameState = null;
        let isMyTurn = false;
        let localRenderingInProgress = false; 
        let lastWinShownFor = null;

        const faceRotations = {
            1: "rotateX(0deg) rotateY(0deg)",
            2: "rotateY(-90deg)",
            3: "rotateX(-90deg)",
            4: "rotateX(90deg)",
            5: "rotateY(90deg)",
            6: "rotateY(180deg)"
        };

        window.onload = () => {
            if(!gameId) { alert("رابط الغرفة غير صالح!"); window.location.href = 'index.html'; return; }
            
            if (isSpectator) {
                document.getElementById('ludo-role-text').innerText = `أنت تشاهد المباراة 👁️ ${gameType === 'ludo4' ? '(4 لاعبين)' : '(1v1)'}`;
                db.ref(`games/${gameId}/spectators/${spectatorName}`).set(true);
                db.ref(`games/${gameId}/spectators/${spectatorName}`).onDisconnect().remove();
            } else {
                document.getElementById('ludo-role-text').innerText = `أنت تلعب باللون: ${getRoleName(myRole)} ${gameType === 'ludo4' ? '(4 لاعبين)' : '(1v1)'}`;
                if (myRole === 'yellow') {
                    document.getElementById('ludo-grid').classList.add('perspective-yellow');
                }
            }

            initGameData();
            createGrid();
            buildProgressPanel();
            listenToGameState();
            listenToSpectators();
        };

        function getRoleName(r) {
            const names = { red: 'الأحمر 🔴', yellow: 'الأصفر 🟡', green: 'الأخضر 🟢', blue: 'الأزرق 🔵' };
            return names[r] || r;
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function sendInviteToFriend(btn) {
            btn.innerText = "تم الإرسال";
            btn.style.background = "#555";
            btn.disabled = true;
            showToast("✅ تم إرسال دعوة اللعب لصديقك!");
            setTimeout(() => closeModal('friends-modal'), 1000);
        }

        function initGameData() {
            db.ref('games/' + gameId).once('value').then(snap => {
                let data = snap.val();
                if (!data || !data.tokens) {
                    let initialTokens = { red: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1] };
                    if(gameType === 'ludo4') { initialTokens.green = [-1,-1,-1,-1]; initialTokens.blue = [-1,-1,-1,-1]; }
                    db.ref('games/' + gameId).update({
                        tokens: initialTokens, turn: 'red',
                        dicePool: [], consecutiveSixes: 0,
                        diceRolled: false, winner: '',
                        rematchVotes: { red: false, yellow: false, green: false, blue: false }
                    });
                }
            }).catch(err => {
                console.error(err);
                showToast("⚠️ خطأ في الاتصال بقاعدة البيانات");
            });
        }

        function buildProgressPanel() {
            const panel = document.getElementById('progress-panel');
            const roles = gameType === 'ludo4' ? ['red','green','yellow','blue'] : ['red','yellow'];
            panel.innerHTML = '';
            roles.forEach(r => {
                const item = document.createElement('div');
                item.className = 'progress-item';
                item.innerHTML = `<span>${r === 'red' ? '🔴' : r === 'yellow' ? '🟡' : r === 'green' ? '🟢' : '🔵'}</span>
                    <div class="progress-dots" id="progress-dots-${r}">
                        ${'<span class="p-dot p-' + r + '"></span>'.repeat(4)}
                    </div>`;
                panel.appendChild(item);
            });
        }

        function updateProgress(tokensObj) {
            if (!tokensObj) return;
            for (const color in tokensObj) {
                const dots = document.querySelectorAll(`#progress-dots-${color} .p-dot`);
                if (!dots.length) continue;
                const done = tokensObj[color].filter(p => p === 57).length;
                dots.forEach((d, i) => d.classList.toggle('filled', i < done));
            }
        }

        function createGrid() {
            const grid = document.getElementById('ludo-grid');
            grid.innerHTML = ''; 

            const roles = ['red', 'yellow', 'green', 'blue'];
            roles.forEach(r => {
                const zone = document.createElement('div');
                zone.className = 'player-dice-zone';
                zone.id = `dice-zone-${r}`;
                zone.onclick = () => rollDiceProcess(r);
                
                let labelText = r === 'red' ? 'الأحمر' : r === 'yellow' ? 'الأصفر' : r === 'green' ? 'الأخضر' : 'الأزرق';
                zone.innerHTML = `
                    <span class="dice-label">${labelText}</span>
                    <div class="scene-dice">
                        <div id="cube-${r}" class="cube-dice">
                            <div class="cube-face face-1">1</div>
                            <div class="cube-face face-2">2</div>
                            <div class="cube-face face-3">3</div>
                            <div class="cube-face face-4">4</div>
                            <div class="cube-face face-5">5</div>
                            <div class="cube-face face-6">6</div>
                        </div>
                    </div>
                    <div class="pool-badge" id="pool-badge-${r}">فارغ</div>
                `;
                grid.appendChild(zone);
            });

            for(let row = 0; row < 15; row++) {
                for(let col = 0; col < 15; col++) {
                    if(row < 6 && col < 6) { if(row===0 && col===0) addHomeArea(grid, 'green', 1, 1); continue; }
                    if(row < 6 && col > 8) { if(row===0 && col===9) addHomeArea(grid, 'yellow', 1, 10); continue; }
                    if(row > 8 && col < 6) { if(row===9 && col===0) addHomeArea(grid, 'red', 10, 1); continue; }
                    if(row > 8 && col > 8) { if(row===9 && col===9) addHomeArea(grid, 'blue', 10, 10); continue; }
                    
                    const cell = document.createElement('div');
                    cell.className = 'ludo-cell';
                    cell.id = `cell-${row}-${col}`;
                    
                    if(row === 7 && col >= 1 && col <= 5) cell.classList.add('ludo-green-bg');
                    else if(row === 7 && col >= 9 && col <= 13) cell.classList.add('ludo-blue-bg');
                    else if(col === 7 && row >= 1 && row <= 5) cell.classList.add('ludo-yellow-bg');
                    else if(col === 7 && row >= 9 && row <= 13) cell.classList.add('ludo-red-bg');
                    
                    else if(row === 6 && col === 1) cell.classList.add('ludo-green-bg');
                    else if(row === 1 && col === 8) cell.classList.add('ludo-yellow-bg');
                    else if(row === 8 && col === 13) cell.classList.add('ludo-blue-bg');
                    else if(row === 13 && col === 6) cell.classList.add('ludo-red-bg');
                    
                    if(row >= 6 && row <= 8 && col >= 6 && col <= 8) {
                        cell.style.background = 'linear-gradient(45deg, var(--ludo-red) 25%, var(--ludo-blue) 25%, var(--ludo-blue) 50%, var(--ludo-yellow) 50%, var(--ludo-yellow) 75%, var(--ludo-green) 75%)';
                        if (row === 7 && col === 7) {
                            cell.id = "center-finish-zone";
                        } else {
                            cell.id = "center-cell";
                        }
                    }

                    if((row===6 && col===2) || (row===2 && col===6) || (row===8 && col===12) || (row===12 && col===8)) {
                        cell.innerHTML = '<span class="ludo-safe">⭐</span>';
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function addHomeArea(grid, color, gridRow, gridCol) {
            const area = document.createElement('div');
            area.className = `ludo-home-area ludo-${color}-bg`;
            area.style.gridRow = `${gridRow} / span 6`; area.style.gridColumn = `${gridCol} / span 6`;
            const inner = document.createElement('div');
            inner.className = 'ludo-home-inner'; inner.id = `home-${color}`;
            for(let i=0; i<4; i++) {
                const slot = document.createElement('div'); 
                slot.className = 'ludo-token-slot'; 
                slot.id = `home-slot-${color}-${i}`;
                inner.appendChild(slot);
            }
            area.appendChild(inner); grid.appendChild(area);
        }

        function listenToSpectators() {
            db.ref(`games/${gameId}/spectators`).on('value', snap => {
                const specs = snap.val() || {};
                const count = Object.keys(specs).length;
                document.getElementById('spectator-count').innerText = count;
                
                const container = document.getElementById('spectators-list-container');
                if (count === 0) {
                    container.innerHTML = "لا يوجد مشاهدين حالياً.";
                } else {
                    let html = '';
                    for(let s in specs) {
                        html += `<div class="spectator-item">👤 ${s}</div>`;
                    }
                    container.innerHTML = html;
                }
            });
        }

        function listenToGameState() {
            db.ref('games/' + gameId).on('value', snap => {
                const data = snap.val();
                if(!data) return;
                gameState = data;
                
                if (isSpectator) {
                    isMyTurn = false;
                } else {
                    isMyTurn = (data.turn === myRole);
                }
                
                updateDiceUI(data);
                updateProgress(data.tokens);
                
                if (!localRenderingInProgress) {
                    renderTokens(data.tokens);
                }

                const winOverlay = document.getElementById('win-overlay');
                if(data.winner) {
                    document.getElementById('ludo-status-text').innerText = `🏆 الفائز هو: ${getRoleName(data.winner)}`;
                    
                    if (lastWinShownFor !== data.winner) {
                        lastWinShownFor = data.winner;
                        winOverlay.classList.add('active');
                        document.getElementById('win-title').innerText = `🏆 فاز بالمعركة: ${getRoleName(data.winner)} 🏆`;
                        launchConfetti();
                        AudioEngine.playWin();
                    }
                    
                    if(isSpectator) {
                        document.getElementById('vote-btn-ui').style.display = 'none';
                    } else {
                        document.getElementById('vote-btn-ui').style.display = '';
                    }

                    const votes = data.rematchVotes || {};
                    const statusList = document.getElementById('rematch-status-list');
                    statusList.innerHTML = '';
                    
                    let activeRoles = gameType === 'ludo4' ? ['red', 'green', 'yellow', 'blue'] : ['red', 'yellow'];
                    let allPlayersAgreed = true;
                    
                    activeRoles.forEach(role => {
                        const rowEl = document.createElement('div');
                        const hasVoted = votes[role] === true;
                        if (!hasVoted) allPlayersAgreed = false;
                        rowEl.innerText = `${getRoleName(role)}: ${hasVoted ? '✅ وافق على الإعادة' : '⏳ بانتظار التصويت...'}`;
                        statusList.appendChild(rowEl);
                    });

                    if (allPlayersAgreed) {
                        setTimeout(() => {
                            resetGameState();
                            winOverlay.classList.remove('active');
                            lastWinShownFor = null;
                        }, 1200);
                    }
                } else {
                    winOverlay.classList.remove('active');
                    lastWinShownFor = null;
                }
            });
        }

        function resetGameState() {
            let initialTokens = { red: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1] };
            if(gameType === 'ludo4') { initialTokens.green = [-1,-1,-1,-1]; initialTokens.blue = [-1,-1,-1,-1]; }
            db.ref('games/' + gameId).update({
                tokens: initialTokens, turn: 'red',
                dicePool: [], consecutiveSixes: 0,
                diceRolled: false, winner: '',
                rematchVotes: { red: false, yellow: false, green: false, blue: false }
            });
        }

        function launchConfetti() {
            const container = document.getElementById('confetti-container');
            if (!container) return;
            container.innerHTML = '';
            const colors = ['#ff2a5f', '#10b981', '#ffd700', '#00f0ff', '#a855f7', '#f97316'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = (Math.random() * 3) + 's';
                piece.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                if (Math.random() > 0.7) piece.style.borderRadius = '50%';
                container.appendChild(piece);
            }
        }

        function updateDiceUI(data) {
            const statusEl = document.getElementById('ludo-status-text');
            const roles = ['red', 'yellow', 'green', 'blue'];
            
            roles.forEach(r => {
                const zone = document.getElementById(`dice-zone-${r}`);
                const badge = document.getElementById(`pool-badge-${r}`);
                const cube = document.getElementById(`cube-${r}`);
                
                if(!zone) return;

                if(gameType === 'ludo2' && (r === 'green' || r === 'blue')) {
                    zone.style.display = 'none';
                    return;
                } else {
                    zone.style.display = 'flex';
                }

                if(data.turn === r) {
                    zone.classList.add('active-dice-turn');
                    const poolArray = data.dicePool || [];
                    badge.innerText = poolArray.length > 0 ? poolArray.join(' + ') : 'دور الرمي';
                    if(poolArray.length > 0 && cube && !cube.classList.contains('rolling')) {
                        let lastVal = poolArray[poolArray.length - 1];
                        cube.style.transform = faceRotations[lastVal] || faceRotations[1];
                    }
                } else {
                    zone.classList.remove('active-dice-turn');
                    badge.innerText = 'انتظار...';
                }
            });

            if (isSpectator) {
                statusEl.innerText = `⏳ اللاعب ${getRoleName(data.turn)} يخطط للهجوم...`;
            } else if(isMyTurn) {
                if(!data.diceRolled) {
                    statusEl.innerText = "🟢 دورك! اضغط على نردك لترميه.";
                } else {
                    statusEl.innerText = "👆 اضغط على أحد أحجارك لبدء التحريك الاستراتيجي...";
                    checkIfCanMove(); 
                }
            } else {
                statusEl.innerText = `⏳ انتظار اللاعب ${getRoleName(data.turn)} ليلعب...`;
            }
        }

        function rollDiceProcess(clickedRole) {
            if(isSpectator || !isMyTurn || gameState.diceRolled || clickedRole !== myRole || isRollingDice) return;
            
            isRollingDice = true;
            AudioEngine.playDice();

            const myCube = document.getElementById(`cube-${myRole}`);
            if(myCube) myCube.classList.add('rolling');

            setTimeout(() => {
                if(myCube) myCube.classList.remove('rolling');
                const roll = Math.floor(Math.random() * 6) + 1;
                
                let currentPool = gameState.dicePool || [];
                let currentSixes = gameState.consecutiveSixes || 0;

                if(roll === 6) {
                    currentSixes++;
                    if(currentSixes === 3) {
                        db.ref('games/' + gameId).update({
                            dicePool: [],
                            consecutiveSixes: 0,
                            diceRolled: false,
                            turn: getNextTurnFrom(gameState.turn)
                        }).finally(() => { isRollingDice = false; });
                        showToast("🔴 حصلت على رقم 6 ثلاث مرات متتالية! ينقلب الدور.");
                        return;
                    }
                    currentPool.push(roll);
                    db.ref('games/' + gameId).update({
                        dicePool: currentPool,
                        consecutiveSixes: currentSixes,
                        diceRolled: false 
                    }).finally(() => { isRollingDice = false; });
                } else {
                    currentPool.push(roll);
                    db.ref('games/' + gameId).update({
                        dicePool: currentPool,
                        consecutiveSixes: 0,
                        diceRolled: true 
                    }).finally(() => { isRollingDice = false; });
                }
            }, 600);
        }

        function renderTokens(tokensObj) {
            if (!tokensObj) return;
            document.querySelectorAll('.ludo-token').forEach(e => e.remove());

            for (const color in tokensObj) {
                tokensObj[color].forEach((pos, index) => {
                    const token = document.createElement('div');
                    token.className = `ludo-token token-${color}`;
                    token.id = `token-${color}-${index}`; 
                    
                    if(!isSpectator && isMyTurn && color === myRole && gameState.diceRolled && hasAnyValidMove(pos)) {
                        token.classList.add('active-turn');
                    }
                    
                    token.onclick = () => handleTokenInteraction(color, index, pos);

                    if (pos === -1) {
                        const slot = document.getElementById(`home-slot-${color}-${index}`);
                        if(slot) slot.appendChild(token);
                    } else {
                        let cellId = getCellIdFromPosition(color, pos);
                        const cell = document.getElementById(cellId);
                        if(cell) cell.appendChild(token);
                    }
                });
            }
        }

        function hasAnyValidMove(pos) {
            let pool = gameState.dicePool || [];
            return pool.some(dice => canMoveToken(pos, dice));
        }

        function getCellIdFromPosition(color, pos) {
            if (pos === 57) return "center-finish-zone";

            if(pos === 51) {
                if(color === 'red') return "cell-14-7";
                if(color === 'green') return "cell-7-0";
                if(color === 'yellow') return "cell-0-7";
                if(color === 'blue') return "cell-7-14";
            }

            if(pos < 52) {
                let actualIndex = (pos + startOffsets[color]) % 52;
                let coord = pathCoords[actualIndex];
                return `cell-${coord.r}-${coord.c}`;
            } else if(pos >= 52 && pos <= 56) {
                let coord = homePaths[color][pos - 52];
                return `cell-${coord.r}-${coord.c}`;
            }
            return "center-cell";
        }

        function handleTokenInteraction(color, index, currentPos) {
            if(isSpectator || !isMyTurn || color !== myRole || !gameState.diceRolled || isMovingToken) return;

            let pool = gameState.dicePool || [];

            if(currentPos === -1) {
                if(pool.includes(6)) {
                    executeStrategyMove(index, currentPos, 6);
                }
                return;
            }

            let validChoices = pool.filter(dice => canMoveToken(currentPos, dice));
            if(validChoices.length === 0) return;

            if(validChoices.length === 1) {
                executeStrategyMove(index, currentPos, validChoices[0]);
            } else {
                showChoiceOverlay(index, currentPos, validChoices);
            }
        }

        function showChoiceOverlay(index, currentPos, choices) {
            const overlay = document.getElementById('choice-overlay');
            const container = document.getElementById('choice-buttons-container');
            container.innerHTML = '';
            
            let uniqueChoices = [...new Set(choices)];
            
            uniqueChoices.forEach(dice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = `تحريك بمقدار (${dice}) مربعات`;
                btn.onclick = () => {
                    overlay.classList.remove('active');
                    executeStrategyMove(index, currentPos, dice);
                };
                container.appendChild(btn);
            });
            overlay.classList.add('active');
        }

        async function executeStrategyMove(index, currentPos, selectedDice) {
            if (isMovingToken) return;
            isMovingToken = true;
            localRenderingInProgress = true;

            let targetPos = currentPos === -1 ? 0 : currentPos + selectedDice;
            
            if(currentPos === -1) {
                AudioEngine.playStep();
                drawTokenAtTemporaryPosition(myRole, index, 0);
                await new Promise(r => setTimeout(r, 220));
            } else {
                for(let step = currentPos + 1; step <= targetPos; step++) {
                    AudioEngine.playStep();
                    drawTokenAtTemporaryPosition(myRole, index, step);
                    await new Promise(r => setTimeout(r, 200)); 
                }
            }

            localRenderingInProgress = false;

            let currentPool = gameState.dicePool || [];
            let idxToRemove = currentPool.indexOf(selectedDice);
            if(idxToRemove > -1) currentPool.splice(idxToRemove, 1);

            let updates = {};
            let gotBonus = false;

            if (targetPos < 52 && targetPos >= 0) {
                let actualGlobalPos = (targetPos + startOffsets[myRole]) % 52;
                if(!safeZones.includes(actualGlobalPos)) {
                    for(const oppColor in gameState.tokens) {
                        if(oppColor !== myRole) {
                            gameState.tokens[oppColor].forEach((oppPos, oppIdx) => {
                                if(oppPos >= 0 && oppPos < 52) {
                                    let oppGlobalPos = (oppPos + startOffsets[oppColor]) % 52;
                                    if(actualGlobalPos === oppGlobalPos) {
                                        AudioEngine.playEat();
                                        updates[`tokens/${oppColor}/${oppIdx}`] = -1;
                                        gotBonus = true; 
                                        showToast(`💥 تم أكل حجر اللاعب ${getRoleName(oppColor)}! دور إضافي لك.`);
                                    }
                                }
                            });
                        }
                    }
                }
            }

            if(targetPos === 57) {
                gotBonus = true;
                showToast("🎉 مذهل! وصل حجرك للنهاية.");
            }

            updates[`tokens/${myRole}/${index}`] = targetPos;
            updates['dicePool'] = currentPool;

            if(currentPool.length === 0) {
                if(gotBonus) {
                    updates['diceRolled'] = false; 
                    updates['turn'] = myRole;
                } else {
                    updates['diceRolled'] = false;
                    updates['turn'] = getNextTurnFrom(gameState.turn);
                }
            } else {
                updates['diceRolled'] = true;
                updates['turn'] = myRole;
            }

            try {
                await db.ref('games/' + gameId).update(updates);
                checkWinCondition(index, targetPos);
            } catch (err) {
                console.error(err);
                showToast("⚠️ حدث خطأ، حاول مجدداً");
            } finally {
                isMovingToken = false;
            }
        }

        function drawTokenAtTemporaryPosition(color, index, tempPos) {
            const existingToken = document.getElementById(`token-${color}-${index}`);
            if(existingToken) existingToken.remove();
            
            const token = document.createElement('div');
            token.className = `ludo-token token-${color} token-jump`; 
            token.id = `token-${color}-${index}`;
            
            let cellId = getCellIdFromPosition(color, tempPos);
            const cell = document.getElementById(cellId);
            if(cell) cell.appendChild(token);
        }

        function canMoveToken(pos, dice) {
            if (pos === -1) return dice === 6; 
            if (pos + dice > 57) return false; 
            return true;
        }

        function checkIfCanMove() {
            if (noMoveTimerScheduled) return;
            let pool = gameState.dicePool || [];
            if(pool.length === 0) return;
            if(gameState.turn !== myRole) return;

            let canMoveAny = false;
            gameState.tokens[myRole].forEach(pos => {
                pool.forEach(dice => {
                    if (canMoveToken(pos, dice)) canMoveAny = true;
                });
            });

            if(!canMoveAny) {
                noMoveTimerScheduled = true;
                const turnSnapshot = gameState.turn;
                const poolSnapshot = [...pool];
                const tokenSnapshot = [...gameState.tokens[myRole]];
                
                setTimeout(() => {
                    noMoveTimerScheduled = false;
                    // التحقق من عدم تغير الحالة أثناء الانتظار
                    if (!gameState) return;
                    if (isMovingToken) return;
                    if (gameState.turn !== turnSnapshot) return;
                    if (JSON.stringify(gameState.dicePool) !== JSON.stringify(poolSnapshot)) return;
                    if (JSON.stringify(gameState.tokens[myRole]) !== JSON.stringify(tokenSnapshot)) return;

                    db.ref('games/' + gameId).update({ 
                        dicePool: [], 
                        diceRolled: false, 
                        turn: getNextTurnFrom(turnSnapshot) 
                    });
                    showToast("لا توجد حركات متاحة - تم تمرير الدور");
                }, 1400);
            }
        }

        function getNextTurnFrom(currentTurn) {
            if(gameType === 'ludo2') {
                return currentTurn === 'red' ? 'yellow' : 'red';
            } else {
                const order = ['red', 'green', 'yellow', 'blue'];
                let idx = order.indexOf(currentTurn);
                return order[(idx + 1) % 4];
            }
        }

        function checkWinCondition(movedIndex, movedTargetPos) {
            if (!gameState || !gameState.tokens) return;
            let allFinished = true;
            gameState.tokens[myRole].forEach((pos, i) => {
                if (i === movedIndex) {
                    if (movedTargetPos !== 57) allFinished = false;
                } else {
                    if (pos !== 57) allFinished = false;
                }
            });
            if(allFinished) { 
                db.ref('games/' + gameId).update({ winner: myRole });
            }
        }

        function voteRematch() {
            if(isSpectator) return;
            db.ref(`games/${gameId}/rematchVotes/${myRole}`).set(true);
            document.getElementById('vote-btn-ui').innerText = '✅ تم التصويت';
        }

        function exitGame() { window.location.href = 'index.html'; }
    </script>
